name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from go.mod, not from typing a version into two files and keeping them in step.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      # The alert rules are the part of a monitoring stack that fails silently, so they are checked here.
      - name: check the alert rules
        run: docker run --rm -v "$PWD/infra/prometheus:/p" --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/rules.yml
      - name: check the compose file
        run: docker compose config -q

  # The claim in the README is about a running stack, so a job brings one up and asks it the question. This
  # is slower than the go job - images are pulled - and it is the only job that can catch a chart-shaped
  # mistake such as a config file that looks right and is not.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make up
      - run: make demo
      - name: a play session is a trace with the match on it
        run: |
          set -euo pipefail
          make traces
          curl -fsS "http://localhost:16686/api/traces?service=gameserver&limit=10" \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['data'];assert d, 'no traces';assert any(x['key']=='game.match.id' for t in d for s in t['spans'] for x in s['tags']), 'traces carry no match id';print(len(d),'traces, all with the match on them')"
      - name: the metrics are being scraped
        run: |
          set -euo pipefail
          curl -fsS "http://localhost:9090/api/v1/targets" \
            | python3 -c "import sys,json;t=json.load(sys.stdin)['data']['activeTargets'];bad=[x['labels']['job'] for x in t if x['health']!='up'];assert not bad, bad;print('targets up:', [x['labels']['job'] for x in t])"
      - if: always()
        run: docker compose logs --tail=40
      - if: always()
        run: make down
