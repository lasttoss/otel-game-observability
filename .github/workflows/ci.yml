name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from go.mod, not from typing a version into two files and keeping them in step.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      # The alert rules are the part of a monitoring stack that fails silently, so they are checked here.
      - name: check the alert rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/rules.yml
      - name: check the compose file
        run: docker compose config -q

  # The claim in the README is about a running stack, so a job brings one up and asks it the question. It is
  # slower than the go job - five images are pulled - and it is the only job that can catch the kind of
  # mistake that a linted config file cannot: something that looks right and does not work.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bring the stack up
        run: make up
      - name: play a session
        run: make demo
      - name: ask the stack the question in the README
        run: python3 scripts/check-telemetry.py
      - if: always()
        run: docker compose logs --tail=40
      - if: always()
        run: make down
