name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from go.mod, not from typing a version into two files and keeping them in step.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      # The alert rules are the part of a monitoring stack that fails silently, so they are checked here.
      - name: check the alert rules
        run: docker run --rm -v "$PWD/infra/prometheus:/p" --entrypoint promtool prom/prometheus:v3.1.0 check rules /p/rules.yml
      - name: check the compose file
        run: docker compose config -q

  # The claim in the README is about a running stack, so a job brings one up and asks it the question. This
  # is slower than the go job - images are pulled - and it is the only job that can catch a chart-shaped
  # mistake such as a config file that looks right and is not.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make up
      - run: make demo
      # A telemetry pipeline is eventually consistent: the collector batches, Jaeger indexes, Prometheus
      # scrapes. Asserting once is asserting against the runner's speed - the first version of this job
      # failed exactly there, on a stack that was working.
      - name: a play session is a trace with the match on it
        run: |
          set -euo pipefail
          assert_trace() {
            curl -fsS "http://localhost:16686/api/traces?service=gameserver&limit=10" | python3 -c "
import sys, json
d = json.load(sys.stdin)['data']
assert d, 'Jaeger returned no traces'
with_id = [t for t in d if any(x['key'] == 'game.match.id' for s in t['spans'] for x in s['tags'])]
assert with_id, 'no trace carries the match id'
print(len(d), 'traces,', len(with_id), 'with the match on them')"
          }
          until assert_trace; do
            echo "waiting for the batch, the index and the scrape to catch up"; sleep 5
          done
      - name: the metrics are being scraped
        run: |
          set -euo pipefail
          targets_up() {
            curl -fsS "http://localhost:9090/api/v1/targets" | python3 -c "
import sys, json
t = json.load(sys.stdin)['data']['activeTargets']
bad = [x['labels']['job'] for x in t if x['health'] != 'up']
assert t, 'Prometheus knows no targets'
assert not bad, 'down: ' + ', '.join(bad)
print('targets up:', [x['labels']['job'] for x in t])"
          }
          until targets_up; do sleep 5; done
      - if: always()
        run: docker compose logs --tail=40
      - if: always()
        run: make down
