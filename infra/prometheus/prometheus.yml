global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gameserver
    static_configs:
      - targets: ["gameserver:8080"]
  # The collector exposes the health of the pipeline itself. Bound to localhost by default, so the
  # collector sets its own listener; if this target is down the traces are not arriving anywhere.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
